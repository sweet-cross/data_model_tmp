# ----------------------------------------------------------------------------
#                         TABLE DESCRIPTION
# ----------------------------------------------------------------------------
name: result_total_system_costs
title: Total annual system costs
description: >
  Total annual system costs by year, model and scenario. Result of scenario runs.

contract_type: ValueVariable
# ----------------------------------------------------------------------------
#                ----- Frictionless Table Schema -----
# ----------------------------------------------------------------------------
tableschema:
  # ----------------------------------------------------------------------------
  #                SEMANTIC FIELD DESCRIPTION
  # ----------------------------------------------------------------------------

  # ----------------------------------------------------------------------------
  #                        FOREIGN KEY CONSTRAINTS
  # ----------------------------------------------------------------------------
  # A list of field names that are jointly unique. As it is an assumption table,
  # it include the scenario information. E.g.
  primaryKey:
    [
      model,
      scenario_group,
      scenario_name,
      scenario_variant,
      country,
      year,
      unit,
    ]

  foreignKeys:
    - fields: country
      reference:
        resource: dim_iso_region
        fields: id

    - fields: model
      reference:
        resource: dim_model
        fields: id

    - fields: [ scenario_group, scenario_name, scenario_variant ]
      reference:
        resource: dim_scenario
        fields: [ group, name, variant ]

  # ----------------------------------------------------------------------------
  #                  FRICTIONLESS FIELDS/COLUMNS
  # ----------------------------------------------------------------------------
  fields:
    - name: model
      type: string
      title: Model
      description: Model that produced the data
      constraints:
        required: true

    - name: scenario_group
      type: string
      title: Scenario Group
      description: Scenario group
      constraints:
        required: true

    - name: scenario_name
      type: string
      title: Scenario Name
      description: Scenario name
      constraints:
        required: true

    - name: scenario_variant
      type: string
      title: Scenario Variant
      description: Scenario variant
      constraints:
        required: true

    - name: country
      type: string
      title: Country Code
      description: ISO 3166-1 alpha-2 country code
      constraints:
        required: true
        maxLength: 8

    - name: year
      type: integer
      title: Year
      description: Year to which the data value applies
      constraints:
        required: true

    - name: unit
      type: string
      title: Unit
      description: Measurement unit of the reported value
      constraints:
        required: true
        enum: [ "BCHF" ]

    - name: value
      type: number
      title: Value
      description: Total annual system costs in the specified unit for the given country, year, model, and scenario
      constraints:
        required: true
        minimum: 0
        maximum: 1500
